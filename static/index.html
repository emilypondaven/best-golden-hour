<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>First Light — Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night:    #0b1020;
    --card:     #141b2e;
    --line:     #232c44;
    --frost:    #e9edf6;
    --haze:     #8b97b0;
    --ember:    #ff8a5b;
    --gold:     #f5c26b;

    --display: "Instrument Serif", Georgia, serif;
    --body:    "IBM Plex Sans", system-ui, sans-serif;
    --mono:    "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--night);
    background-image: radial-gradient(120% 60% at 50% 100%, #1b2340 0%, transparent 70%);
    color: var(--frost);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  /* Theme variants: light for sunrise/day, dark for sunset/night */
  body[data-theme="sunrise"], body[data-theme="day"] {
    --night: #fff8f2; /* page background (light) */
    --card: #ffffff;
    --line: #e6e6e9;
    --frost: #0b1020; /* primary text */
    --haze: #6b7280;  /* muted text */
    --ember: #ff6a3d; /* accent */
    --gold: #d97706;
    background: var(--night);
    background-image: radial-gradient(120% 60% at 50% 0%, #fff4e6 0%, transparent 60%);
    color: var(--frost);
  }

  body[data-theme="sunset"], body[data-theme="night"] {
    /* keep the existing darker palette (defaults are set in :root) */
  }

  main { max-width: 40rem; margin: 0 auto; }

  /* ---- theme toggle ---- */
  .theme-toggle {
    position: fixed;
    top: 1.25rem;
    right: 1.25rem;
    width: 2.5rem;
    height: 2.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 50%;
    background: var(--card);
    color: var(--gold);
    cursor: pointer;
    z-index: 20;
    transition: border-color .15s, transform .15s;
  }
  .theme-toggle:hover { border-color: var(--haze); transform: scale(1.06); }
  .theme-toggle svg { width: 18px; height: 18px; display: block; }

  /* ---- masthead ---- */
  .eyebrow {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--haze);
    margin: 0 0 .4rem;
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    line-height: 1;
    margin: 0 0 1.25rem;
  }

  /* ---- search ---- */
  .search { display: flex; gap: .5rem; margin-bottom: 1.75rem; }
  .search input {
    flex: 1;
    font-family: var(--body);
    font-size: .95rem;
    color: var(--frost);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: .6rem .8rem;
    min-width: 0;
  }
  .search input::placeholder { color: var(--haze); }
  .search input:focus { outline: none; border-color: var(--haze); }
  .search button {
    font-family: var(--mono);
    font-size: .78rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--night);
    background: var(--gold);
    border: 0;
    border-radius: 9px;
    padding: .6rem 1rem;
    cursor: pointer;
  }
  .search button:hover { background: #ffd489; }

  /* ---- hero: the one morning worth the alarm ---- */
  .hero {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.5rem 1.4rem;
    margin-bottom: 2rem;
    background:
      linear-gradient(180deg, rgba(255,138,91,.11), rgba(255,138,91,0) 65%),
      var(--card);
    opacity: 0;
    animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .hero .label {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ember);
    margin: 0 0 .5rem;
  }
  .hero .location {
    font-family: var(--mono);
    font-size: .9rem;
    letter-spacing: .08em;
    color: var(--gold);
    margin: 0 0 .65rem;
  }
  .hero .day {
    font-family: var(--display);
    font-size: clamp(2rem, 8vw, 2.6rem);
    line-height: 1.05;
    margin: 0;
  }
  .hero .day em { font-style: italic; color: var(--gold); }
  .hero .time {
    font-family: var(--mono);
    font-size: 1rem;
    color: var(--haze);
    margin: .55rem 0 .9rem;
  }
  .hero .reason { margin: 0; font-size: 1.02rem; line-height: 1.45; }

  /* ---- the week ---- */
  .week { display: flex; flex-direction: column; gap: .55rem; }

  .row {
    display: grid;
    grid-template-columns: 6px 1fr auto;
    gap: 0 1rem;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: .85rem 1rem .85rem 0;
    overflow: hidden;
    opacity: 0;
    animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .row.is-best { border-color: rgba(245,194,107,.45); }

  /* signature: the strip IS the predicted sky, banded by score */
  .horizon { align-self: stretch; border-radius: 0 3px 3px 0; }

  .day-name { font-size: 1rem; margin: 0 0 .15rem; }
  .row .meta {
    font-family: var(--mono);
    font-size: .74rem;
    color: var(--haze);
    margin: 0;
  }
  .row .reason { font-size: .84rem; color: var(--haze); margin: .3rem 0 0; }

  .score {
    font-family: var(--mono);
    font-size: 1.55rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  /* ---- rating ---- */
  .rate { display: flex; gap: .4rem; margin-top: .55rem; }
  .rate button {
    font: inherit;
    font-size: .78rem;
    color: var(--haze);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: .25rem .6rem;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .rate button:hover { border-color: var(--haze); color: var(--frost); }
  .rate button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .rate .done { border: 0; padding-left: 0; color: var(--gold); cursor: default; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- states ---- */
  .note {
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--haze);
    line-height: 1.6;
  }
  .note button {
    font: inherit;
    color: var(--gold);
    background: none;
    border: 0;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }
  footer { margin-top: 2.5rem; }

  @keyframes rise { to { opacity: 1; transform: none; } }
  .hero, .row { transform: translateY(10px); }
  @media (prefers-reduced-motion: reduce) {
    .hero, .row { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to sunset (dark) mode" title="Switch to sunset (dark) mode">
  <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"></svg>
</button>
<main>
  <form id="search" class="search">
    <input id="where" type="search" placeholder="London" aria-label="Place name"
           autocomplete="off" spellcheck="false">
    <button type="submit">Look up</button>
    <button type="button" id="geolocate">Use my location</button>
  </form>
  <div id="app"><p class="note">Reading the sky&hellip;</p></div>
  <footer><p class="note" id="foot"></p></footer>
</main>

<script>
const DEFAULT_PLACE = "London";
const app  = document.getElementById("app");
const foot = document.getElementById("foot");
let place = DEFAULT_PLACE, ratings = {}, currentPlaceLabel = DEFAULT_PLACE;

// Score bands, described as the sky they predict.
const BANDS = [
  { min: 80, name: "Full colour",  css: "linear-gradient(180deg,#ffcf7a,#ff7a59 55%,#7d3a63)" },
  { min: 60, name: "Some colour",  css: "linear-gradient(180deg,#f6c07a,#d98a52 60%,#4a3a55)" },
  { min: 35, name: "Pale",         css: "linear-gradient(180deg,#a8b6cd,#7b8aa6 60%,#414d68)" },
  { min: 0,  name: "Flat grey",    css: "linear-gradient(180deg,#5b6472,#434a56 60%,#333944)" },
];
const band = s => BANDS.find(b => s >= b.min);

// ---- theme toggle: light = sunrise, dark = sunset ----
const THEME_KEY = "first-light-theme";
const SUNRISE_ICON = `<path d="M12 2v7"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m17 8-5 5-5-5"/><path d="M16 18a4 4 0 0 0-8 0"/>`;
const SUNSET_ICON  = `<path d="M12 9V2"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m7 8 5-5 5 5"/><path d="M16 18a4 4 0 0 0-8 0"/>`;

const themeToggle = document.getElementById("theme-toggle");
const themeIcon = document.getElementById("theme-icon");
const isLightTheme = t => t === "sunrise" || t === "day";
const phaseForTheme = t => t === "sunset" || t === "night" ? "sunset" : "sunrise";

function paintThemeToggle(theme) {
  const light = isLightTheme(theme);
  themeIcon.innerHTML = light ? SUNRISE_ICON : SUNSET_ICON;
  const label = `Switch to ${light ? "sunset (dark)" : "sunrise (light)"} mode`;
  themeToggle.setAttribute("aria-label", label);
  themeToggle.title = label;
}

function setTheme(theme) {
  document.body.dataset.theme = theme;
  paintThemeToggle(theme);
}

themeToggle.onclick = () => {
  const next = isLightTheme(document.body.dataset.theme) ? "sunset" : "sunrise";
  localStorage.setItem(THEME_KEY, next);
  setTheme(next);
  if (currentData) render(currentData);
};

const form = document.getElementById("search");
const input = document.getElementById("where");
const geoButton = document.getElementById("geolocate");
let currentData = null;

form.onsubmit = e => {
  e.preventDefault();
  const typed = input.value.trim();
  if (typed) { place = typed; currentPlaceLabel = typed; load(); }
};
geoButton.onclick = () => useMyLocation();

async function useMyLocation() {
  if (!navigator.geolocation) {
    app.innerHTML = `<p class="note">Geolocation is not supported by your browser.</p>`;
    return;
  }
  app.innerHTML = `<p class="note">Finding your location…</p>`;
  foot.textContent = "";
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude, longitude } = pos.coords;
    try {
      const res = await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${latitude.toFixed(2)}&longitude=${longitude.toFixed(2)}&language=en&count=1`);
      if (!res.ok) throw new Error("Location lookup failed");
      const data = await res.json();
      const hit = data.results && data.results[0];
      if (!hit) throw new Error("No location found");
      const label = [hit.name, hit.admin1, hit.country].filter(Boolean).join(", ");
      place = label || DEFAULT_PLACE;
      currentPlaceLabel = label || DEFAULT_PLACE;
      input.value = place;
      load();
    } catch (error) {
      app.innerHTML = `<p class="note">Could not resolve your location. Try searching instead.</p>`;
      console.error(error);
    }
  }, err => {
    app.innerHTML = `<p class="note">Location access denied or unavailable.</p>`;
    console.error(err);
  }, { timeout: 8000 });
}

async function load() {
  app.innerHTML = `<p class="note">Reading the sky over ${place}&hellip;</p>`;
  foot.textContent = "";
  try {
    const [f, r] = await Promise.all([
      fetch(`/api/forecast?place=${encodeURIComponent(place)}`),
      fetch("/api/ratings"),
    ]);
    if (f.status === 404) {
      const { detail } = await f.json();
      app.innerHTML = `<p class="note">${detail}</p>`;
      return;
    }
    if (!f.ok) throw new Error(await f.text());
    ratings = Object.fromEntries((await r.json()).map(x => [x.date, x.rating]));
    currentData = await f.json();
    render(currentData);
  } catch (e) {
    app.innerHTML = `<p class="note">No forecast right now — the weather service
      didn't answer. <button onclick="load()">Try again</button></p>`;
    console.error(e);
  }
}

function render(data) {
  const days = [...data.days];
  const theme = applyTheme(data);
  const phase = data.phase || phaseForTheme(theme);
  const phaseLabel = phase === "sunrise" ? "Sunrise forecast" : "Sunset forecast";
  const phaseTitle = phase === "sunrise" ? "First Light" : "Last Light";
  const phaseSummary = phase === "sunrise" ? data.sunrise_week_summary : data.sunset_week_summary;
  const bestDate = phase === "sunrise" ? data.best_sunrise_date : data.best_sunset_date;
  const best = days.find(d => d.date === bestDate) || days[0];
  const bestScore = best[phase]?.scores?.score ?? best.score;
  const bestReason = best[phase]?.scores?.reason ?? best.reason;
  const today = new Date().toLocaleDateString("en-CA");

  document.title = `${phaseTitle} — First Light`;
  app.innerHTML = `
    <section class="phase-head">
      <p class="eyebrow">${phaseLabel}</p>
      <h1>${phaseTitle}</h1>
    </section>
    <section class="hero">
      <p class="location">Forecast for ${data.place || currentPlaceLabel}</p>
      <p class="day">${best.date === today ? "Today" : best.weekday}, <em>${best[phase]?.time || best.sunrise.time}</em></p>
      <p class="time">${band(bestScore).name} &middot; scored ${bestScore} of 100</p>
      <p class="reason">${phaseSummary}</p>
    </section>
    <section class="week">${days.map(row.bind(null, data, phase, bestDate, today)).join("")}</section>`;

  document.querySelectorAll(".row").forEach((el, i) => {
    el.style.animationDelay = `${120 + i * 45}ms`;
  });
  app.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => rate(b));

  foot.textContent =
    `${data.place} · scored ${data.source === "llm" ? "by model" : "by rules only"} `
    + `at ${data.generated.slice(11, 16)} · data from Open-Meteo`;
}

function applyTheme(data) {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) { setTheme(saved); return saved; }
  try {
    const today = new Date().toLocaleDateString("en-CA");
    const todayObj = data.days.find(d => d.date === today) || data.days[0];
    const [y, m, d] = (todayObj.date || data.days[0].date).split("-").map(Number);
    const [srH, srM] = (todayObj.sunrise?.time || "06:00").split(":").map(Number);
    const [ssH, ssM] = (todayObj.sunset?.time || "18:00").split(":").map(Number);
    const sunrise = new Date(y, m - 1, d, srH, srM);
    const sunset  = new Date(y, m - 1, d, ssH, ssM);
    const now = new Date();

    const sunriseStart = new Date(sunrise.getTime() - 60 * 60 * 1000); // -1h
    const sunriseEnd   = new Date(sunrise.getTime() + 2 * 60 * 60 * 1000); // +2h
    const sunsetStart  = new Date(sunset.getTime() - 2 * 60 * 60 * 1000); // -2h
    const sunsetEnd    = new Date(sunset.getTime() + 60 * 60 * 1000); // +1h

    if (now >= sunriseStart && now <= sunriseEnd) {
      setTheme("sunrise");
      return "sunrise";
    } else if (now >= sunsetStart && now <= sunsetEnd) {
      setTheme("sunset");
      return "sunset";
    } else if (now > sunriseEnd && now < sunsetStart) {
      setTheme("day");
      return "day";
    } else {
      setTheme("night");
      return "night";
    }
  } catch (e) {
    // fallback: leave default
    console.warn("Theme application failed:", e);
    return document.body.dataset.theme || "night";
  }
}

function row(data, phase, bestDate, today, d) {
  const past = d.date <= today;
  const rated = ratings[d.date];
  const phaseData = d[phase] || d.sunrise;
  const score = phaseData.scores?.score ?? d.score;
  const reason = phaseData.scores?.reason ?? d.reason;
  return `
    <article class="row ${d.date === bestDate ? "is-best" : ""}">
      <div class="horizon" style="background:${band(score).css}"></div>
      <div>
        <p class="day-name">${d.date === today ? "Today" : d.weekday}</p>
        <p class="meta">${phaseData.time} &middot; ${band(score).name}</p>
        <p class="reason">${reason}</p>
        ${past ? rateHTML(d.date, rated) : ""}
      </div>
      <div class="score">${score}</div>
    </article>`;
}

function rateHTML(date, rated) {
  if (rated) return `<p class="rate"><span class="done">Logged
    ${rated === 1 ? "as good" : "as a dud"}</span></p>`;
  return `<div class="rate">
    <button data-rate="1"  data-date="${date}">Was good</button>
    <button data-rate="-1" data-date="${date}">Wasn't</button>
  </div>`;
}

async function rate(btn) {
  const { date, rate: rating } = btn.dataset;
  btn.setAttribute("aria-pressed", "true");
  try {
    const res = await fetch("/api/rate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date, rating: +rating, place }),
    });
    if (!res.ok) throw new Error(await res.text());
    ratings[date] = +rating;
    btn.closest(".rate").outerHTML = rateHTML(date, +rating);
  } catch (e) {
    btn.closest(".rate").innerHTML =
      `<span class="done" style="color:var(--ember)">Didn't save — try again</span>`;
    console.error(e);
  }
}

const initialTheme = localStorage.getItem(THEME_KEY) || document.body.dataset.theme || "night";
setTheme(initialTheme);
load();
</script>
</body>
</html>
