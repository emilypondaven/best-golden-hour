<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>First Light — Forecast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<script>
  const PRELOAD_THEME_KEY = "first-light-theme";
  const preloadTheme = localStorage.getItem(PRELOAD_THEME_KEY);
  if (preloadTheme) {
    document.body.dataset.theme = preloadTheme;
  }
</script>
<button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to sunset (dark) mode" title="Switch to sunset (dark) mode">
  <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round"></svg>
</button>
<main>
  <div id="app"><p class="note">Reading the sky&hellip;</p></div>
  <footer>
    <p class="note" id="foot"></p>
    <form id="search" class="search">
      <input id="where" type="search" placeholder="Somewhere else&hellip;"
             aria-label="Place name" autocomplete="off" spellcheck="false">
      <button type="submit">Look up</button>
    </form>
    <p class="note"><button type="button" id="geolocate">Use my location</button></p>
  </footer>
</main>

<script src="/static/app.js" defer></script>
</body>
</html>
