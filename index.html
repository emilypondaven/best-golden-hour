<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>First Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --night:    #0b1020;
    --card:     #141b2e;
    --line:     #232c44;
    --frost:    #e9edf6;
    --haze:     #8b97b0;
    --ember:    #ff8a5b;
    --gold:     #f5c26b;

    --display: "Instrument Serif", Georgia, serif;
    --body:    "IBM Plex Sans", system-ui, sans-serif;
    --mono:    "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1.25rem 4rem;
    background: var(--night);
    background-image: radial-gradient(120% 60% at 50% 100%, #1b2340 0%, transparent 70%);
    color: var(--frost);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  main { max-width: 40rem; margin: 0 auto; }

  /* ---- masthead ---- */
  .eyebrow {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--haze);
    margin: 0 0 .4rem;
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    line-height: 1;
    margin: 0 0 1.75rem;
  }

  /* ---- hero: the one morning worth the alarm ---- */
  .hero {
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.5rem 1.4rem;
    margin-bottom: 2rem;
    background:
      linear-gradient(180deg, rgba(255,138,91,.11), rgba(255,138,91,0) 65%),
      var(--card);
    opacity: 0;
    animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .hero .label {
    font-family: var(--mono);
    font-size: .7rem;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--ember);
    margin: 0 0 .5rem;
  }
  .hero .day {
    font-family: var(--display);
    font-size: clamp(2rem, 8vw, 2.6rem);
    line-height: 1.05;
    margin: 0;
  }
  .hero .day em { font-style: italic; color: var(--gold); }
  .hero .time {
    font-family: var(--mono);
    font-size: 1rem;
    color: var(--haze);
    margin: .55rem 0 .9rem;
  }
  .hero .reason { margin: 0; font-size: 1.02rem; line-height: 1.45; }

  /* ---- the week ---- */
  .week { display: flex; flex-direction: column; gap: .55rem; }

  .row {
    display: grid;
    grid-template-columns: 6px 1fr auto;
    gap: 0 1rem;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: .85rem 1rem .85rem 0;
    overflow: hidden;
    opacity: 0;
    animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards;
  }
  .row.is-best { border-color: rgba(245,194,107,.45); }

  /* signature: the strip IS the predicted sky, banded by score */
  .horizon { align-self: stretch; border-radius: 0 3px 3px 0; }

  .day-name { font-size: 1rem; margin: 0 0 .15rem; }
  .row .meta {
    font-family: var(--mono);
    font-size: .74rem;
    color: var(--haze);
    margin: 0;
  }
  .row .reason { font-size: .84rem; color: var(--haze); margin: .3rem 0 0; }

  .score {
    font-family: var(--mono);
    font-size: 1.55rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  /* ---- rating ---- */
  .rate { display: flex; gap: .4rem; margin-top: .55rem; }
  .rate button {
    font: inherit;
    font-size: .78rem;
    color: var(--haze);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: .25rem .6rem;
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .rate button:hover { border-color: var(--haze); color: var(--frost); }
  .rate button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .rate .done { border: 0; padding-left: 0; color: var(--gold); cursor: default; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---- states ---- */
  .note {
    font-family: var(--mono);
    font-size: .78rem;
    color: var(--haze);
    line-height: 1.6;
  }
  .note button {
    font: inherit;
    color: var(--gold);
    background: none;
    border: 0;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
  }
  footer { margin-top: 2.5rem; }

  @keyframes rise { to { opacity: 1; transform: none; } }
  .hero, .row { transform: translateY(10px); }
  @media (prefers-reduced-motion: reduce) {
    .hero, .row { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Sunrise forecast</p>
  <h1>First Light</h1>
  <div id="app"><p class="note">Reading the sky&hellip;</p></div>
  <footer><p class="note" id="foot"></p></footer>
</main>

<script>
const FALLBACK = { lat: 51.47, lon: -0.37 };   // Hounslow
const app  = document.getElementById("app");
const foot = document.getElementById("foot");
let coords = FALLBACK, ratings = {};

// Score bands, described as the sky they predict.
const BANDS = [
  { min: 80, name: "Full colour",  css: "linear-gradient(180deg,#ffcf7a,#ff7a59 55%,#7d3a63)" },
  { min: 60, name: "Some colour",  css: "linear-gradient(180deg,#f6c07a,#d98a52 60%,#4a3a55)" },
  { min: 35, name: "Pale",         css: "linear-gradient(180deg,#a8b6cd,#7b8aa6 60%,#414d68)" },
  { min: 0,  name: "Flat grey",    css: "linear-gradient(180deg,#5b6472,#434a56 60%,#333944)" },
];
const band = s => BANDS.find(b => s >= b.min);

function getLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(FALLBACK);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: +p.coords.latitude.toFixed(2), lon: +p.coords.longitude.toFixed(2) }),
      () => resolve(FALLBACK),
      { timeout: 6000 }
    );
  });
}

async function load() {
  coords = await getLocation();
  try {
    const [f, r] = await Promise.all([
      fetch(`/api/forecast?lat=${coords.lat}&lon=${coords.lon}`),
      fetch("/api/ratings"),
    ]);
    if (!f.ok) throw new Error(await f.text());
    ratings = Object.fromEntries((await r.json()).map(x => [x.date, x.rating]));
    render(await f.json());
  } catch (e) {
    app.innerHTML = `<p class="note">No forecast right now — the weather service
      didn't answer. <button onclick="load()">Try again</button></p>`;
    console.error(e);
  }
}

function render(data) {
  const days = [...data.days];
  const best = days.find(d => d.date === data.best_date) || days[0];
  const today = new Date().toISOString().slice(0, 10);

  app.innerHTML = `
    <section class="hero">
      <p class="label">Worth the alarm</p>
      <p class="day">${best.date === today ? "This morning" : best.weekday}, <em>${best.sunrise}</em></p>
      <p class="time">${band(best.score).name} &middot; scored ${best.score} of 100</p>
      <p class="reason">${data.week_summary}</p>
    </section>
    <section class="week">${days.map(row.bind(null, data, today)).join("")}</section>`;

  document.querySelectorAll(".row").forEach((el, i) => {
    el.style.animationDelay = `${120 + i * 45}ms`;
  });
  app.querySelectorAll("[data-rate]").forEach(b => b.onclick = () => rate(b));

  foot.textContent =
    `${coords.lat}, ${coords.lon} · scored ${data.source === "llm" ? "by model" : "by rules only"} `
    + `at ${data.generated.slice(11, 16)} · data from Open-Meteo`;
}

function row(data, today, d) {
  const past = d.date <= today;
  const rated = ratings[d.date];
  return `
    <article class="row ${d.date === data.best_date ? "is-best" : ""}">
      <div class="horizon" style="background:${band(d.score).css}"></div>
      <div>
        <p class="day-name">${d.date === today ? "Today" : d.weekday}</p>
        <p class="meta">${d.sunrise} &middot; ${band(d.score).name}</p>
        <p class="reason">${d.reason}</p>
        ${past ? rateHTML(d.date, rated) : ""}
      </div>
      <div class="score">${d.score}</div>
    </article>`;
}

function rateHTML(date, rated) {
  if (rated) return `<p class="rate"><span class="done">Logged
    ${rated === 1 ? "as good" : "as a dud"}</span></p>`;
  return `<div class="rate">
    <button data-rate="1"  data-date="${date}">Was good</button>
    <button data-rate="-1" data-date="${date}">Wasn't</button>
  </div>`;
}

async function rate(btn) {
  const { date, rate: rating } = btn.dataset;
  btn.setAttribute("aria-pressed", "true");
  try {
    const res = await fetch("/api/rate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ date, rating: +rating, ...coords }),
    });
    if (!res.ok) throw new Error(await res.text());
    ratings[date] = +rating;
    btn.closest(".rate").outerHTML = rateHTML(date, +rating);
  } catch (e) {
    btn.closest(".rate").innerHTML =
      `<span class="done" style="color:var(--ember)">Didn't save — try again</span>`;
    console.error(e);
  }
}

load();
</script>
</body>
</html>
